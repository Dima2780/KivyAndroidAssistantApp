name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake aidl libltdl-dev libjpeg-dev libpng-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-

      # ⚡ Сборка с ЛОГИРОВАНИЕМ ВСЕГО
      - name: Build APK (debug)
        id: buildozer
        env:
          BUILDOZER_ALLOW_ROOT: '1'
        run: |
          set -o pipefail
          printf 'y\n' | buildozer -v android debug 2>&1 | tee build_full.log
        continue-on-error: true

      # 🔍 ДЕТЕКТИВ — ищем APK где угодно
      - name: Locate APK
        id: locate
        if: always()
        run: |
          echo "==============================================="
          echo "  ПОИСК APK НА RUNNER'Е"
          echo "==============================================="
          echo ""
          echo "--- Содержимое ./bin/ ---"
          ls -la bin/ 2>/dev/null || echo "  ❌ папка ./bin/ отсутствует или пуста"
          echo ""
          echo "--- Поиск всех .apk в workspace ---"
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "--- Поиск всех .apk в HOME ---"
          find "$HOME" -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "--- Поиск всех .apk в /tmp ---"
          find /tmp -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "==============================================="
          echo "  ХВОСТ ЛОГА (последние 80 строк)"
          echo "==============================================="
          tail -80 build_full.log 2>/dev/null || echo "лога нет"
          
          # Ищем APK
          APK=$(find "$GITHUB_WORKSPACE" "$HOME" /tmp -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo ""
            echo "✅ НАЙДЕН APK: $APK"
            echo "apk_found=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "❌ APK НЕ НАЙДЕН"
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
          fi

      # 📤 Грузим APK (если найден)
      - name: Upload APK
        if: always() && steps.locate.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30

      # 📋 Всегда грузим лог
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log
          if-no-files-found: ignore
          retention-days: 14

      # 💥 Если APK не найден — красим сборку КРАСНЫМ
      - name: Fail if no APK
        if: always() && steps.locate.outputs.apk_found != 'true'
        run: |
          echo "::error::APK не был собран — смотри build-log artifact"
          exit 1
