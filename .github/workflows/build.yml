name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake aidl libltdl-dev libjpeg-dev libpng-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-global-

      - name: Cache Buildozer local
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: bz-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-local-

      - name: Build APK (debug)
        env:
          BUILDOZER_ALLOW_ROOT: '1'
        run: |
          printf 'y\n' | buildozer -v android debug 2>&1 | tee build_full.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log
          if-no-files-found: ignore
          retention-days: 14
